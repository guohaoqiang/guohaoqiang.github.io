<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Introductory Post</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;margin:24px;max-width:900px}</style>
</head>
<body>
  <article>
    <h1>Introductory Post</h1>
    <div class="meta">2025-12-21</div>
    <div id="post-reads" class="meta" style="color:#666;font-size:13px;margin-top:6px">Reads: <span id="reads-count">…</span></div>
    <div class="content"><h1>Introductory Post</h1>
<p>Happy New Year! This is a sample older post.</p>
<pre><code class="language-bash"># a shell example
ls -la
</code></pre>
<p>Short excerpt text for the posts.json example.</p></div>
  </article>
  <script>document.querySelectorAll('pre code').forEach((b)=>{try{hljs.highlightElement(b)}catch(e){}})</script>
  <script>
    // Increment and display read counter (and a referrer-specific counter) using CountAPI
    (function(){
      document.addEventListener('DOMContentLoaded', async ()=>{
        const ns = 'hqguo_github_io';
        const slug = (location.pathname.split('/').pop() || '').replace(/\.html$/,'');
        const readsEl = document.getElementById('reads-count');
        if(!slug) return;
        try{
          // increment main counter and use returned value to display
          try{
            const hitRes = await fetch(`https://api.countapi.xyz/hit/${ns}/${slug}`);
            if(hitRes.ok){
              const hitJson = await hitRes.json();
              if(typeof hitJson.value !== 'undefined' && readsEl) readsEl.textContent = hitJson.value;
            }
          }catch(e){console.warn('count hit failed',e)}

          // track referrer domain (or 'direct') — fire-and-forget
          try{
            let ref = 'direct';
            if(document.referrer){ try{ ref = (new URL(document.referrer)).hostname.replace(/\./g,'-'); }catch(e){} }
            fetch(`https://api.countapi.xyz/hit/${ns}/${slug}-ref-${ref}`).catch(()=>{});
          }catch(e){}

        }catch(e){console.warn('count logic failed',e)}
      });
    })();
  </script>
</body>
</html>
