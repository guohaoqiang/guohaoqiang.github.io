<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Post reads & referrers</title>
  <style>
    body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;margin:24px;max-width:960px}
    table{width:100%;border-collapse:collapse;margin-top:16px}
    th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}
    th{background:#fafafa}
    .muted{color:#666;font-size:13px}
    .small{font-size:13px}
    input[type=text]{width:260px;padding:6px}
    button{padding:6px 10px;margin-left:6px}
    .loader{opacity:0.6}
  </style>
</head>
<body>
  <h1>Admin — Post Statistics</h1>
  <p class="muted">Viewing private read counts stored in <strong>BLOG_STATS_KV</strong>.</p>

  <table id="posts-table">
    <thead>
      <tr><th>Post</th><th>Date</th><th>Total reads</th><th>Status</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function fetchJSON(url){
      try{ const r = await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }catch(e){console.warn('fetch failed',url,e); return null }
    }

    async function buildTable(){
      // 1. Extract the JWT token from the URL (passed from index.html)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.body.innerHTML = "<h1>Unauthorized</h1><p>Please access this page via the Admin link on the homepage.</p>";
      return;
    }

    // 2. Fetch all counts from your Cloudflare Worker in one go
    let counts = {};
    try {
      const response = await fetch('https://admin-proxy.9ohnny.workers.dev', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-counts', password: token }) // Password here is your JWT
      });

      if (response.ok) {
        const data = await response.json();
        counts = data.counts || {};
      } else {
        console.error("Worker rejected token or is misconfigured.");
      }
    } catch (e) {
      console.error("Failed to connect to admin-proxy:", e);
    }

    // 3. Get the list of posts and build the table
    const posts = await fetchJSON('/posts/posts.json') || [];
    const tbody = document.querySelector('#posts-table tbody');
    tbody.innerHTML = '';

    for (const p of posts) {
      const tr = document.createElement('tr');
      
      // Post Title and Date
      const titleTd = document.createElement('td'); titleTd.textContent = p.title; tr.appendChild(titleTd);
      const dateTd = document.createElement('td'); dateTd.textContent = p.date; tr.appendChild(dateTd);
      
      // Total Reads from KV
      const readsTd = document.createElement('td');
      const count = counts[p.slug] || 0;
      readsTd.innerHTML = `<strong>${count}</strong> ${count === 1 ? 'read' : 'reads'}`;
      tr.appendChild(readsTd);

      // Status/Referrer info
      const statusTd = document.createElement('td');
      statusTd.className = 'muted small';
      statusTd.textContent = 'Tracking via BLOG_STATS_KV';
      tr.appendChild(statusTd);

      tbody.appendChild(tr);
    }
  }

        buildTable();
  </script>
</body>
</html>
