<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Post reads & referrers</title>
  <style>
    .btn-back {
      display: inline-block;
      text-decoration: none;
      color: #666;
      background: #f5f5f5;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #ddd;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: #eeeeee;
      color: #111;
      border-color: #ccc;
    }
    body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;margin:24px;max-width:960px}
    table{width:100%;border-collapse:collapse;margin-top:16px}
    th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}
    th{background:#fafafa}
    .muted{color:#666;font-size:13px}
    .small{font-size:13px}
    input[type=text]{width:260px;padding:6px}
    button{padding:6px 10px;margin-left:6px}
    .loader{opacity:0.6}
  </style>
</head>
<body>
  <div style="margin-bottom: 20px; display: flex; gap: 10px;">
    <a href="/" class="btn-back">← Back to Home</a>
    <button id="sort-toggle" class="btn-back">Sort by Reads ↓</button>
  </div>
  <h1>Admin — Post Statistics</h1>
  <p class="muted">Viewing private read counts stored in <strong>BLOG_STATS_KV</strong>.</p>

  <div id="total-stats" style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee;">
    <span class="muted">Total Site Reads:</span> 
    <strong id="total-count" style="font-size: 1.2em; color: #0b5fa5;">0</strong>
  </div>
  <table id="posts-table">
    <thead>
      <tr><th>Post</th><th>Date</th><th>Total reads</th><th>Status</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let isSortedByReads = false;

  async function fetchJSON(url) {
    try { const r = await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
    catch(e) { console.warn('fetch failed', url, e); return null; }
  }

  async function buildTable() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.body.innerHTML = "<h1>Unauthorized</h1><p>Please access this page via the Admin link on the homepage.</p>";
      return;
    }

    let counts = {};
    try {
      const response = await fetch('https://admin-proxy.9ohnny.workers.dev', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-counts', password: token })
      });
      if (response.ok) {
        const data = await response.json();
        counts = data.counts || {};

        // --- ADD THESE TWO LINES TO CALCULATE THE TOTAL ---
        const totalHits = Object.values(counts).reduce((sum, val) => sum + val, 0);
        document.getElementById('total-count').textContent = totalHits.toLocaleString();
      }
    } catch (e) { console.error("Failed to connect:", e); }

    const posts = await fetchJSON('/posts/posts.json') || [];

    // --- NEW SORTING LOGIC ---
    if (isSortedByReads) {
      posts.sort((a, b) => (counts[b.slug] || 0) - (counts[a.slug] || 0));
    }

    const tbody = document.querySelector('#posts-table tbody');
    tbody.innerHTML = '';

    for (const p of posts) {
      const tr = document.createElement('tr');
      const count = counts[p.slug] || 0;
      
      tr.innerHTML = `
        <td>${p.title}</td>
        <td>${p.date}</td>
        <td><strong>${count}</strong> ${count === 1 ? 'read' : 'reads'}</td>
        <td class="muted small">Verified via BLOG_STATS_KV</td>
      `;
      tbody.appendChild(tr);
    }
  }

  // Handle Sort Toggle
  document.getElementById('sort-toggle').addEventListener('click', (e) => {
    isSortedByReads = !isSortedByReads;
    e.target.textContent = isSortedByReads ? "Sort by Date ↓" : "Sort by Reads ↓";
    buildTable();
  });

  buildTable();
  </script>
</body>
</html>
