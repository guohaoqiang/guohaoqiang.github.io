# Wrangler Configuration Guide
# This project uses separate workers for different functions

# For Admin Proxy Worker:
#   wrangler publish --config wrangler-admin.toml

# For Avatar Verification Worker:
#   wrangler publish --config wrangler-avatar.toml

# Secrets (shared across both workers):
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put SENDGRID_KEY
